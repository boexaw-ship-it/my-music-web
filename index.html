<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BaZaw MUSIC (GitHub Test)</title>
  <meta name="theme-color" content="#0d0f1a">
  <meta name="description" content="ကိုယ်ပိုင် music library">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BaZaw MUSIC">
  
  <!-- CSS လင့်ခ်များ -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/home.css">
  
  <!-- Rabbit Font Converter -->
  <script src="https://cdn.jsdelivr.net/npm/rabbit-node@1.0.3/rabbit.min.js"></script>
</head>
<body>
<div id="app" class="app-container">

  <!-- ===== Left Sidebar ===== -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-text">BaZaw MUSIC</span>
    </div>
    
    <div class="sidebar-menu">
      <h3 class="menu-title">Browse</h3>
      <nav class="nav" aria-label="Library">
        <button class="nav-btn active" data-view="home"><span data-icon="home"></span><span>Home</span></button>
        <button class="nav-btn" data-view="playlists"><span data-icon="playlist"></span><span>Playlist</span></button>
        <button class="nav-btn" data-view="catalog"><span data-icon="albums"></span><span>Album</span></button>
        <button class="nav-btn" data-view="artists"><span data-icon="artist"></span><span>Artist</span></button>
        <button class="nav-btn" data-view="radio"><span data-icon="radio"></span><span>Radio</span></button>
        <!-- GitHub တွင် အမြဲပေါ်စေရန် admin-only class ကို ဖယ်ရှားထားသည် -->
        <button class="nav-btn" data-view="upload"><span data-icon="upload"></span><span>Upload</span></button>
      </nav>
    </div>

    <div class="sidebar-menu">
      <h3 class="menu-title">Top Charts</h3>
      <div id="quick-charts" class="quick-charts">
        <!-- JS ဖြင့် Top Charts သီချင်းများ ဝင်လာမည့်နေရာ -->
      </div>
    </div>
    
    <div class="side-foot">
        <button class="ghost" id="rescan"><span data-icon="refresh"></span><span>ပြန်ဖတ်မယ်</span></button>
    </div>
  </aside>

  <!-- ===== Main Content Area ===== -->
  <main class="main" id="main">
    
    <!-- Top Navigation Bar -->
    <header class="topbar">
      <nav class="top-links">
        <a href="#" class="active">MUSIC</a>
        <a href="#">PODCAST</a>
        <a href="#">LIVE</a>
        <a href="#">GENRES</a>
      </nav>

      <div class="top-right">
        <label class="search-box">
          <span data-icon="search"></span>
          <input id="search" type="search" placeholder="Type Here To Search" autocomplete="off">
        </label>
        
        <!-- GitHub တွင် အမြဲပေါ်စေရန် auth-only class ကို ဖယ်ရှားထားသည် -->
        <div class="user-actions">
          <button class="icon-btn" data-icon="bell" aria-label="Notifications"></button>
          <button class="icon-btn" data-icon="settings" aria-label="Settings"></button>
          <span class="avatar" id="avatar">A</span>
          <button class="icon-btn phone-logout" id="logout" data-icon="logout" aria-label="ထွက်မယ်"></button>
        </div>
      </div>
    </header>

    <!-- Dynamic View Area (Home, Catalog, etc. ဝင်လာမည့်နေရာ) -->
    <div id="view" class="view-content scrollable">
        <!-- ယခင် UI JS က ဤနေရာတွင် Hero Banner, Top Music များကို Render လုပ်ပါမည် -->
    </div>
    
  </main>

  <!-- ===== Phone Bottom Tab Bar ===== -->
  <nav class="tabbar" aria-label="Library">
    <button class="tab-btn active" data-view="home"><span data-icon="home"></span><span>Home</span></button>
    <button class="tab-btn" data-view="catalog"><span data-icon="albums"></span><span>Catalog</span></button>
    <button class="tab-btn" data-view="playlists"><span data-icon="playlist"></span><span>Playlists</span></button>
    <button class="tab-btn" data-view="upload"><span data-icon="upload"></span><span>Upload</span></button>
  </nav>

  <!-- ===== Bottom Player Bar ===== -->
  <div class="player-bar" id="player" hidden>
    
    <div class="player-left">
      <div class="p-info" id="open-np">
        <div class="p-cover" id="p-cover-img"></div>
        <div class="p-text-wrap">
          <b class="p-title"></b>
          <span class="p-artist"></span>
        </div>
      </div>
      <button class="icon-btn p-fav" data-act="fav" aria-label="Favorite"></button>
    </div>

    <div class="player-center">
      <div class="p-controls">
        <button class="icon-btn p-shuffle" data-act="shuffle" data-icon="shuffle" aria-label="Shuffle"></button>
        <button class="icon-btn" data-act="prev" data-icon="prev" aria-label="Previous"></button>
        <button class="play-btn" data-act="play" aria-label="Play / Pause"></button>
        <button class="icon-btn" data-act="next" data-icon="next" aria-label="Next"></button>
        <button class="icon-btn p-repeat" data-act="repeat" aria-label="Repeat"></button>
      </div>
      <div class="p-seek-wrap">
        <span class="t-cur">0:00</span>
        <input class="seek-bar" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <span class="t-dur">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="icon-btn" data-icon="queue" aria-label="Queue"></button>
      <button class="icon-btn" data-icon="volume" aria-label="Mute"></button>
      <input id="volume" class="vol-bar" type="range" min="0" max="100" value="100" aria-label="Volume">
      <button class="icon-btn" data-icon="expand" aria-label="Full Screen"></button>
    </div>
    
  </div>

  <!-- ===== Phone Full-Screen Now Playing ===== -->
  <section class="np-mobile" id="np" aria-label="Now playing" hidden>
     <!-- Mobile View အတွက် ယခင်အတိုင်းထားပါမည် -->
  </section>

</div>

<audio id="audio" preload="metadata"></audio>

<!-- GitHub Test အတွက် Mock API ကို Override လုပ်သည့် Script -->
<script>
  // GitHub Pages တွင် API မရှိသောကြောင့် api/me တောင်းပါက admin အဖြစ် အမြဲ အောင်မြင်အောင် လုပ်ထားသည်
  const originalFetch = window.fetch;
  window.fetch = async function(url, options) {
    if (url.includes('/api/me')) {
      return new Response(JSON.stringify({ role: 'admin' }), { status: 200, headers: { 'Content-Type': 'application/json' } });
    }
    // သီချင်းစာရင်းကို တောင်းပါက root တွင်ရှိသော library.json ကိုသာ တိုက်ရိုက်ဖတ်ပါမည်
    if (url.includes('__rescan')) {
      url = 'library.json'; 
    }
    return originalFetch(url, options);
  };
</script>

<script type="module" src="js/main.js"></script>
</body>
</html>
